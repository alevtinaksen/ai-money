services:
  - type: web
    name: ai-money-bot
    plan: free
    runtime: python
    buildCommand: pip install --upgrade pip && (if [ -f bot/requirements.txt ]; then pip install -r bot/requirements.txt; else pip install -r requirements.txt; fi)
    startCommand: sh -c "if [ -d bot ]; then cd bot; fi && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHONPATH
        value: bot:.
