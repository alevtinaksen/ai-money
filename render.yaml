# Optional Docker blueprint. Configure durable external PostgreSQL before any deploy.
# No deployment or purchase is performed by editing this file.
services:
  - type: web
    name: ai-money
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_LOCAL_LOGIN
        value: "false"
      - key: TELEGRAM_MODE
        value: webhook
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SERVER_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: AI_PROVIDER
        value: disabled
      - key: AI_UPLOAD_CONSENT
        value: "false"
